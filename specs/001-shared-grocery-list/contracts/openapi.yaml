openapi: 3.1.0
info:
  title: CartMates API
  version: 1.0.0
  description: >-
    Same-origin HTTP contract for one CartMates deployment. All responses containing authentication
    or list state use Cache-Control: no-store. Creator identity is always derived from the encrypted
    authenticated session and is never accepted in an add request.
servers:
  - url: /
    description: Current CartMates origin
tags:
  - name: Authentication
  - name: List
paths:
  /api/auth/login:
    get:
      tags: [Authentication]
      summary: Start Google OpenID Connect sign-in
      operationId: startLogin
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
          description: A validated local path only; external destinations are rejected.
      responses:
        '302':
          description: Redirect to Google's authorization endpoint and set a short-lived OAuth transaction cookie.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/auth/callback:
    get:
      tags: [Authentication]
      summary: Complete Google OpenID Connect sign-in
      operationId: completeLogin
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '302':
          description: >-
            Redirect to the local application after setting the session cookie, or redirect to a
            friendly local error state without disclosing list data.
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: End the current CartMates session
      operationId: logout
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session cleared.
          headers:
            Set-Cookie:
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/session:
    get:
      tags: [Authentication]
      summary: Read the authorized CartMates session
      operationId: getSession
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user and deployment presentation data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'

  /api/list:
    get:
      tags: [List]
      summary: Read the authoritative active shopping list
      operationId: getList
      security:
        - cookieAuth: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
          description: Revision ETag returned by a previous list response.
      responses:
        '200':
          description: Authoritative list state.
          headers:
            ETag:
              schema: { type: string }
              description: Quoted list revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '304':
          description: The list revision has not changed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/items:
    post:
      tags: [List]
      summary: Add an item as the authenticated user
      operationId: addItem
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
      responses:
        '200':
          $ref: '#/components/responses/MutationSucceeded'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/items/{itemId}:
    delete:
      tags: [List]
      summary: Remove one active item by stable identifier
      operationId: removeItem
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/MutationSucceeded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/items/{itemId}/bought:
    post:
      tags: [List]
      summary: Mark one active item bought by removing it
      operationId: markItemBought
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/MutationSucceeded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/list/clear:
    post:
      tags: [List]
      summary: Atomically remove every active item
      operationId: clearList
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/MutationSucceeded'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/list/mark-all-bought:
    post:
      tags: [List]
      summary: Atomically mark all active items bought by removing them
      operationId: markAllBought
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/MutationSucceeded'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-cartmates_session
      description: Encrypted, Secure, HttpOnly, SameSite=Strict CartMates session.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Must exactly match the token in the authenticated session.

  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID reused only when retrying the same uncertain mutation.
      schema:
        type: string
        format: uuid

  schemas:
    GroceryItem:
      type: object
      additionalProperties: false
      required: [id, text, creatorName]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^\r\n]*$'
        creatorName:
          type: string
          minLength: 1

    ListResponse:
      type: object
      additionalProperties: false
      required: [revision, items, remainingCount, groupName]
      properties:
        revision:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroceryItem'
        remainingCount:
          type: integer
          minimum: 0
        groupName:
          type: string
          minLength: 1
          default: Our Groceries

    AddItemRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^\r\n]*$'
          description: Server trims leading and trailing whitespace before validation and storage.

    MutationResponse:
      type: object
      additionalProperties: false
      required: [outcome, alreadyProcessed, list]
      properties:
        outcome:
          type: string
          enum: [applied, already_absent, already_empty]
        alreadyProcessed:
          type: boolean
          description: True when this exact idempotency key and request were processed previously.
        list:
          $ref: '#/components/schemas/ListResponse'

    SessionResponse:
      type: object
      additionalProperties: false
      required: [user, groupName, csrfToken]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [displayName, initials]
          properties:
            displayName:
              type: string
              minLength: 1
            initials:
              type: string
              minLength: 1
              maxLength: 4
        groupName:
          type: string
          minLength: 1
          default: Our Groceries
        csrfToken:
          type: string
          minLength: 32

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - validation_failed
                - unauthenticated
                - access_denied
                - csrf_failed
                - idempotency_conflict
                - unsupported_media_type
                - service_unavailable
                - internal_error
            message:
              type: string
              description: Safe user-facing text with no personal data, token, secret, or list content.
            retryable:
              type: boolean

  responses:
    MutationSucceeded:
      description: Mutation resolved and the authoritative current list returned.
      headers:
        ETag:
          schema: { type: string }
          description: Quoted resulting list revision.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MutationResponse'
    BadRequest:
      description: Request syntax or parameter is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationFailed:
      description: Item input is empty, multiline, too long, or otherwise invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: A valid CartMates session is required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AccessDenied:
      description: The authenticated email is no longer allowlisted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Allowlist, Origin, or CSRF authorization failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    IdempotencyConflict:
      description: The idempotency key was already used for a different mutation request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: A JSON request body was required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: A temporary identity-provider or durable-state dependency failure occurred.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
