<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CartMates — asset integration reference</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#ece8f2;color:var(--cm-ink);font-family:var(--cm-font)}header.board{padding:32px 40px 18px}header.board h1{font-size:26px;margin:0 0 6px;letter-spacing:-1px}header.board p{margin:0;color:var(--cm-muted);font-size:14px}.screens{display:flex;gap:26px;padding:20px 40px 42px;align-items:start}.screen{width:390px;flex-shrink:0}.caption{font-size:13px;color:var(--cm-muted);padding:14px 4px}.phone{position:relative;width:390px;height:844px;overflow:hidden;border:1px solid #e6def3;border-radius:36px;background:linear-gradient(155deg,#f7f2ff 0%,#fcfaff 65%,#f4efff 100%);box-shadow:0 12px 32px #25183e16}.phone button{font:inherit;cursor:pointer;border:0}.safe{height:40px}.signin{text-align:center}.hero{width:230px;height:176px;object-fit:contain;margin-top:64px}.signin h2{font-size:43px;letter-spacing:-1.8px;margin:12px 0 18px;font-weight:800}.signin p{font-size:19px;line-height:1.5;color:var(--cm-text);margin:0 auto;max-width:310px}.google{height:62px;width:326px;border-radius:35px;background:white;display:flex;gap:18px;align-items:center;justify-content:center;margin:57px auto 0;box-shadow:var(--cm-shadow-button);color:var(--cm-ink);font-weight:650!important;font-size:18px!important}.google img{width:28px;height:28px}.waves{position:absolute;bottom:0;left:0;width:100%;height:205px}.produce{position:absolute;bottom:8px;left:0;width:390px}.apphead{display:flex;align-items:center;gap:7px;padding:13px 19px 20px}.apphead .mark{width:39px;height:39px}.appname{font-size:23px;font-weight:800;letter-spacing:-.8px}.avatar{margin-left:auto;width:42px;height:42px;border-radius:50%;background:linear-gradient(130deg,#9c83ff,#7458f5);color:white;display:grid;place-items:center;font-size:17px}.content{padding:0 20px}.title{display:flex;align-items:start;gap:14px;margin:24px 0}.title .group{width:28px;height:28px;margin-top:3px}.title h2{font-size:27px;letter-spacing:-.8px;margin:0 0 7px}.title p{margin:0;color:var(--cm-text);font-size:16px}.rays{position:absolute;width:38px;right:20px;top:179px}.list{display:grid;gap:10px}.row{background:#ffffffd9;border:1px solid #f1edf8;box-shadow:var(--cm-shadow-row);border-radius:18px;display:flex;align-items:center;min-height:66px;padding:3px 9px 3px 6px}.buy,.more{width:44px;height:48px;display:grid;place-items:center;padding:0;background:none;color:var(--cm-muted)}.buy img{width:26px;height:26px}.more img{width:24px}.item{flex:1;padding:5px 10px}.name{font-size:19px;font-weight:750;letter-spacing:-.4px;line-height:1.2}.by{color:var(--cm-muted);font-size:13px;line-height:1.4;margin-top:2px}.dock{position:absolute;bottom:51px;left:20px;right:20px}.entry{display:flex;gap:6px;height:52px;align-items:center;border:2px solid var(--cm-border);border-radius:30px;padding-left:18px;background:#ffffff80;color:var(--cm-muted);font-size:16px}.add{margin-left:auto;width:50px;height:50px;flex-shrink:0;border-radius:50%;background:linear-gradient(140deg,#8e70ff,#6944ed);display:grid;place-items:center}.add img{width:28px;filter:brightness(0) invert(1)}.bulk{display:flex;gap:12px;margin-top:22px}.bulk button{height:57px;border-radius:23px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:650;font-size:15px;white-space:nowrap}.bulk img{width:22px;height:22px}.bought{background:var(--cm-success-soft);color:var(--cm-success-ink);flex:1.3}.bought img{filter:invert(31%) sepia(80%) saturate(990%) hue-rotate(105deg) brightness(90%)}.clear{background:var(--cm-danger-soft);color:var(--cm-danger);flex:1}.clear img{filter:invert(26%) sepia(60%) saturate(2200%) hue-rotate(333deg)}.scrim{position:absolute;inset:0;background:var(--cm-scrim)}.sheet{position:absolute;bottom:0;width:100%;height:477px;background:white;border-radius:36px 36px 0 0;padding:24px;text-align:center}.sheet .close{position:absolute;right:16px;top:13px;background:none;width:44px;height:44px;display:grid;place-items:center}.sheet .close img{width:24px}.sheet .confirm-art{width:104px;height:104px}.sheet h2{font-size:27px;line-height:1.25;letter-spacing:-.8px;margin:10px 0 16px}.sheet p{font-size:18px;color:var(--cm-muted);line-height:1.45;margin:0 0 28px}.sheet .yes,.sheet .cancel{width:100%;height:54px;border-radius:28px;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px}.sheet .yes{background:var(--cm-success);color:white}.sheet .yes img{width:24px;filter:brightness(0) invert(1)}.sheet .cancel{background:#f2eff8;color:var(--cm-text);margin-top:12px}.homeindicator{position:absolute;bottom:9px;left:125px;width:140px;height:5px;border-radius:5px;background:#171044;opacity:.18}
@media(max-width:700px){header.board{padding:24px}.screens{padding:10px 24px;overflow:auto}.phone{border-radius:28px}}
</style>
<header class="board"><h1>CartMates / UI assets</h1><p>Vector artwork · transparent PNG exports · mobile implementation reference</p></header>
<main class="screens">
<section class="screen"><div class="phone signin"><div class="safe"></div><img class="hero" src="../public/assets/illustrations/cart-mascot.svg" alt="Smiling cart full of groceries"><h2>CartMates</h2><p>A shared grocery list for<br>your household, flat, or team</p><button class="google"><img src="../public/assets/icons/google-g.svg" alt="">Continue with Google</button><img class="waves" src="../public/assets/backgrounds/login-waves.svg" alt=""><img class="produce" src="../public/assets/illustrations/grocery-footer.svg" alt=""><div class="homeindicator"></div></div><div class="caption">01 / Sign in</div></section>
<section class="screen"><div class="phone" id="list-screen"></div><div class="caption">02 / Shared list with “Added by” labels</div></section>
<section class="screen"><div class="phone" id="confirmation-screen"></div><div class="caption">03 / Mark all bought confirmation</div></section>
</main>
<script>
const asset='../public/assets/';
const rows=[['Milk','Hagay'],['Eggs','Dana'],['Bananas','Noam'],['Bread','Tal'],['Coffee beans','Hagay']].map(([item,person])=>`<div class="row"><button class="buy" aria-label="Mark ${item} bought"><img src="${asset}icons/checkbox-unchecked.svg" alt=""></button><div class="item"><div class="name">${item}</div><div class="by">Added by ${person}</div></div><button class="more" aria-label="More options for ${item}"><img src="${asset}icons/more.svg" alt=""></button></div>`).join('');
const list=`<div class="safe"></div><div class="apphead"><img class="mark" src="${asset}brand/cartmates-mark.svg" alt=""><span class="appname">CartMates</span><div class="avatar" aria-label="Signed in as JD">JD</div></div><div class="content"><div class="title"><img class="group" src="${asset}icons/group.svg" alt=""><div><h2>Our Groceries</h2><p>5 items</p></div></div><img class="rays" src="${asset}illustrations/celebration-rays.svg" alt=""><div class="list">${rows}</div></div><div class="dock"><div class="entry"><span>Add an item…</span><button class="add" aria-label="Add item"><img src="${asset}icons/plus.svg" alt=""></button></div><div class="bulk"><button class="bought"><img src="${asset}icons/check.svg" alt="">Mark all bought</button><button class="clear"><img src="${asset}icons/trash.svg" alt="">Clear list</button></div></div><div class="homeindicator"></div>`;
document.querySelector('#list-screen').innerHTML=list;
document.querySelector('#confirmation-screen').innerHTML=list+`<div class="scrim"></div><div class="sheet"><button class="close" aria-label="Close"><img src="${asset}icons/close.svg" alt=""></button><img class="confirm-art" src="${asset}illustrations/cart-bought.svg" alt=""><h2>Mark all items as<br>bought?</h2><p>This will remove all 5 items<br>from your list.</p><button class="yes"><img src="${asset}icons/check.svg" alt="">Yes, mark all as bought</button><button class="cancel">Cancel</button></div>`;
</script>
</html>
